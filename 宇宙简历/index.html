<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>杨昀桦 · 宇宙履历</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; font-family: 'Inter', system-ui, sans-serif; }
  canvas { display: block; }
  
  #loading {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #000; color: rgba(255,255,255,0.7);
    font-size: 14px; letter-spacing: 2px; z-index: 100;
    transition: opacity 1s;
  }
  #loading .spinner {
    width: 32px; height: 32px;
    border: 2px solid rgba(255,255,255,0.1);
    border-top-color: #5e9eff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading.hidden { opacity: 0; pointer-events: none; }

  #ui {
    position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.35);
    font-size: 13px; letter-spacing: 1px;
    pointer-events: none;
    transition: opacity 0.6s;
    text-align: center;
  }

  #card-panel {
    position: fixed; top: 0; right: -420px;
    width: 400px; height: 100vh;
    background: rgba(10,10,15,0.92);
    backdrop-filter: blur(40px);
    border-left: 1px solid rgba(255,255,255,0.06);
    padding: 60px 32px 40px;
    transition: right 0.5s cubic-bezier(0.16,1,0.3,1);
    z-index: 50;
    overflow-y: auto;
    color: rgba(255,255,255,0.85);
  }
  #card-panel.open { right: 0; }
  #card-panel .close-btn {
    position: absolute; top: 20px; right: 24px;
    background: none; border: none; color: rgba(255,255,255,0.4);
    font-size: 24px; cursor: pointer;
    transition: color 0.2s;
  }
  #card-panel .close-btn:hover { color: #fff; }
  #card-panel h2 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
  #card-panel .sub { font-size: 13px; color: rgba(255,255,255,0.45); margin-bottom: 24px; }
  #card-panel .desc { font-size: 14px; line-height: 1.7; color: rgba(255,255,255,0.65); margin-bottom: 24px; }
  #card-panel .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  #card-panel .tag {
    padding: 4px 10px; font-size: 11px; font-weight: 500;
    border-radius: 6px; background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.06); color: rgba(255,255,255,0.5);
  }

  #back-btn {
    position: fixed; top: 24px; left: 24px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.6);
    padding: 8px 16px; border-radius: 10px;
    font-size: 13px; cursor: pointer;
    transition: all 0.2s; z-index: 40;
    opacity: 0; pointer-events: none;
  }
  #back-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
  #back-btn.visible { opacity: 1; pointer-events: auto; }

  @media (max-width: 600px) {
    #card-panel { width: 100%; right: -100%; }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  加载宇宙中…
</div>

<div id="ui">🪐 拖拽旋转 · 滚轮缩放 · 点击行星探索</div>

<button id="back-btn">⟵ 回到宇宙</button>

<div id="card-panel">
  <button class="close-btn" id="panel-close">✕</button>
  <div id="panel-content"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Data ──────────────────────────────────────────────
const PLANETS = [
  {
    id: 'writing', name: '写作', orbitRadius: 8, speed: 0.12, size: 0.8,
    color: 0x6ec6ff, emissive: 0x1a4a8a,
    detail: {
      title: '《因：一个七天的谎言》',
      subtitle: '长篇悬疑小说 · 百万字',
      desc: '一个失忆的女人，一个冒充男友的男人，一场持续七天的骗局。跨越两年创作，数十万字的长篇悬疑，构建了完整的叙事宇宙。',
      tags: ['悬疑', '长篇小说', '叙事设计', '百万字创作'],
      link: '#'
    }
  },
  {
    id: 'trading', name: '交易', orbitRadius: 12, speed: 0.09, size: 0.9,
    color: 0xffb347, emissive: 0x8a5a1a,
    detail: {
      title: '全自动量化交易系统',
      subtitle: '多策略 · 缠论 · 四季结构',
      desc: '基于缠论二买二卖 + 四季结构出场 + 移动止损的多策略并行交易系统。从数据获取、回测到实盘执行全链路自动化。',
      tags: ['Python', 'Backtest', '缠论', 'Pandas', 'YXR'],
      link: '#'
    }
  },
  {
    id: 'hardware', name: '硬件', orbitRadius: 16, speed: 0.07, size: 1.0,
    color: 0x7c3aed, emissive: 0x3a1a6a,
    detail: {
      title: '辉光管时钟 · 图阿凸',
      subtitle: '硬件创业 · 周易文创',
      desc: '独立设计制作的辉光管时钟，融合科技与美学。图阿凸品牌创始人，探索周易风水文创产品的硬件落地。',
      tags: ['硬件', '辉光管', '产品设计', '创业'],
      link: '#'
    }
  },
  {
    id: 'design', name: '设计', orbitRadius: 20, speed: 0.05, size: 0.7,
    color: 0xf472b6, emissive: 0x6a1a4a,
    detail: {
      title: '平面设计 · 品牌视觉',
      subtitle: '四年经验 · 成都博雅文瑞',
      desc: '参与 2023 成都科幻大会、成都大运会等重大项目。利用 AI 工具搭建自动化内容生产流水线，把控品牌视觉调性。',
      tags: ['Photoshop', 'Illustrator', 'C4D', '品牌设计', 'AI 工作流'],
      link: '#'
    }
  },
  {
    id: 'ai', name: 'AI', orbitRadius: 24, speed: 0.04, size: 0.75,
    color: 0x34d399, emissive: 0x1a4a3a,
    detail: {
      title: '多 Agent 协同系统',
      subtitle: 'Claude + DeepSeek · 记忆共享',
      desc: '一个人控制多个 AI 助手形成团队。消息路由、记忆共享、任务编排，日均 Token 消耗 2 亿，成本 ≤ ¥10。Hermes Agent 生态建设者。',
      tags: ['Claude', 'DeepSeek', 'MCP', 'Agent', 'Prompt 工程'],
      link: '#'
    }
  }
];

// ── Scene Setup ────────────────────────────────────────
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 12, 28);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.prepend(renderer.domElement);

// ── Controls ────────────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 4;
controls.maxDistance = 60;
controls.autoRotate = false;
controls.autoRotateSpeed = 0.3;

// ── Stars ────────────────────────────────────────────────
function createStars() {
  const count = 6000;
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const sizes = new Float32Array(count);

  for (let i = 0; i < count; i++) {
    const r = 50 + Math.random() * 150;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[i*3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i*3+1] = r * Math.cos(phi);
    positions[i*3+2] = r * Math.sin(phi) * Math.sin(theta);

    const c = 0.5 + Math.random() * 0.5;
    const tint = Math.random();
    colors[i*3] = tint < 0.3 ? c : c * 0.9;
    colors[i*3+1] = c * 0.9;
    colors[i*3+2] = tint > 0.7 ? c : c * 0.8;

    sizes[i] = 0.3 + Math.random() * 0.7;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

  const mat = new THREE.PointsMaterial({
    size: 0.15, vertexColors: true, transparent: true, opacity: 0.9,
    sizeAttenuation: true, blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  return new THREE.Points(geo, mat);
}
scene.add(createStars());

// ── Central Star ─────────────────────────────────────────
function createStar() {
  const group = new THREE.Group();

  const geo = new THREE.SphereGeometry(1.8, 48, 48);
  const mat = new THREE.MeshBasicMaterial({ color: 0xffeedd });
  const sphere = new THREE.Mesh(geo, mat);
  group.add(sphere);

  // Glow sprites
  const glowCount = 3;
  for (let i = 0; i < glowCount; i++) {
    const glowGeo = new THREE.SphereGeometry(2.4 + i * 0.6, 32, 32);
    const glowMat = new THREE.MeshBasicMaterial({
      color: 0xffaa66, transparent: true, opacity: 0.06 - i * 0.015,
      wireframe: true
    });
    const glow = new THREE.Mesh(glowGeo, glowMat);
    group.add(glow);
  }

  // Corona particles
  const coronaCount = 200;
  const coronaPos = new Float32Array(coronaCount * 3);
  for (let i = 0; i < coronaCount; i++) {
    const r = 2 + Math.random() * 1.5;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    coronaPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
    coronaPos[i*3+1] = r * Math.cos(phi);
    coronaPos[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
  }
  const coronaGeo = new THREE.BufferGeometry();
  coronaGeo.setAttribute('position', new THREE.BufferAttribute(coronaPos, 3));
  const coronaMat = new THREE.PointsMaterial({
    size: 0.06, color: 0xffcc77, transparent: true, opacity: 0.6,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const corona = new THREE.Points(coronaGeo, coronaMat);
  group.add(corona);

  return group;
}
const centralStar = createStar();
scene.add(centralStar);

// ── Orbit Ring ───────────────────────────────────────────
function createOrbitRing(radius) {
  const points = [];
  const segments = 128;
  for (let i = 0; i <= segments; i++) {
    const angle = (i / segments) * Math.PI * 2;
    points.push(new THREE.Vector3(
      radius * Math.cos(angle), 0, radius * Math.sin(angle)
    ));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(points);
  const mat = new THREE.LineBasicMaterial({
    color: 0x444466, transparent: true, opacity: 0.2
  });
  return new THREE.Line(geo, mat);
}

// ── Planet Factory ──────────────────────────────────────
function createPlanet(data) {
  const group = new THREE.Group();
  
  // Planet sphere
  const geo = new THREE.SphereGeometry(data.size, 32, 32);
  const mat = new THREE.MeshPhysicalMaterial({
    color: data.color,
    emissive: data.emissive,
    emissiveIntensity: 0.3,
    metalness: 0.3,
    roughness: 0.6,
    clearcoat: 0.1,
  });
  const mesh = new THREE.Mesh(geo, mat);
  
  // Glow ring
  const ringGeo = new THREE.RingGeometry(data.size * 1.3, data.size * 1.6, 48);
  const ringMat = new THREE.MeshBasicMaterial({
    color: data.color, transparent: true, opacity: 0.15,
    side: THREE.DoubleSide, depthWrite: false
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.random() * 0.5 + 0.3;
  ring.rotation.z = Math.random() * 0.5;
  
  // Label sprite
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = `rgba(${(data.color >> 16) & 255}, ${(data.color >> 8) & 255}, ${data.color & 255}, 0.8)`;
  ctx.font = 'bold 28px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(data.name, 128, 32);
  
  const labelTex = new THREE.CanvasTexture(canvas);
  labelTex.needsUpdate = true;
  const labelMat = new THREE.SpriteMaterial({
    map: labelTex, transparent: true, opacity: 0.7,
    depthWrite: false, blending: THREE.AdditiveBlending
  });
  const label = new THREE.Sprite(labelMat);
  label.scale.set(3, 0.75, 1);
  label.position.y = -data.size - 0.8;

  group.add(mesh);
  group.add(ring);
  group.add(label);
  
  // Planet-specific features
  if (data.id === 'writing') {
    // Glowing particles around writing planet
    const pCount = 60;
    const pPos = new Float32Array(pCount * 3);
    for (let i = 0; i < pCount; i++) {
      const r = data.size * 1.2 + Math.random() * 0.8;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      pPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
      pPos[i*3+1] = r * Math.cos(phi);
      pPos[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
    }
    const pGeo = new THREE.BufferGeometry();
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    const pMat = new THREE.PointsMaterial({
      size: 0.04, color: 0x6ec6ff, transparent: true, opacity: 0.8,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const particles = new THREE.Points(pGeo, pMat);
    group.add(particles);
  }
  
  if (data.id === 'trading') {
    // Golden ring detail
    const bandGeo = new THREE.TorusGeometry(data.size * 1.5, 0.03, 8, 48);
    const bandMat = new THREE.MeshBasicMaterial({ color: 0xffd700, transparent: true, opacity: 0.5 });
    const band = new THREE.Mesh(bandGeo, bandMat);
    band.rotation.x = Math.PI / 3;
    band.rotation.z = 0.3;
    group.add(band);
    
    const band2 = band.clone();
    band2.rotation.x = -Math.PI / 4;
    band2.rotation.z = 0.6;
    group.add(band2);
  }
  
  if (data.id === 'hardware') {
    // Gear ring
    const gearGeo = new THREE.TorusGeometry(data.size * 1.6, 0.06, 8, 32);
    const gearMat = new THREE.MeshPhysicalMaterial({
      color: 0x7c3aed, metalness: 0.8, roughness: 0.3
    });
    const gear = new THREE.Mesh(gearGeo, gearMat);
    gear.rotation.x = Math.PI / 2;
    group.add(gear);
    
    const gear2 = gear.clone();
    gear2.scale.set(0.7, 0.7, 0.7);
    gear2.rotation.z = 0.5;
    group.add(gear2);
  }

  return group;
}

// ── Build System ────────────────────────────────────────
const planetGroups = [];
const orbits = [];

PLANETS.forEach(p => {
  const orbit = createOrbitRing(p.orbitRadius);
  scene.add(orbit);
  orbits.push(orbit);

  const group = createPlanet(p);
  const angle = Math.random() * Math.PI * 2;
  group.position.x = p.orbitRadius * Math.cos(angle);
  group.position.z = p.orbitRadius * Math.sin(angle);
  scene.add(group);

  planetGroups.push({ group, data: p, angle, orbitRadius: p.orbitRadius });
});

// ── Solar System Layer ──────────────────────────────────
let solarSystemActive = false;
let solarSystemObjects = [];
let zoomTarget = null;
let zoomProgress = 0;
let isZooming = false;

function createSolarSystemView(planetData) {
  // Clear previous
  solarSystemObjects.forEach(o => scene.remove(o));
  solarSystemObjects = [];

  const cx = 0, cy = 0, cz = 0;

  // Ambient glow
  const glowGeo = new THREE.SphereGeometry(3, 32, 32);
  const glowMat = new THREE.MeshBasicMaterial({
    color: planetData.color, transparent: true, opacity: 0.08,
    wireframe: true
  });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  glow.position.set(cx, cy, cz);
  scene.add(glow);
  solarSystemObjects.push(glow);

  const glow2 = glow.clone();
  glow2.scale.set(1.5, 1.5, 1.5);
  glow2.material = glowMat.clone();
  glow2.material.opacity = 0.04;
  scene.add(glow2);
  solarSystemObjects.push(glow2);

  // Project cards as floating panels
  const cards = [
    { title: planetData.detail.title, desc: planetData.detail.desc, tags: planetData.detail.tags, angle: 0 },
    { title: `${planetData.name} · 相关项目`, desc: '探索更多关于 ' + planetData.name + ' 方向的内容', tags: ['进行中'], angle: Math.PI * 0.5 },
    { title: `${planetData.name} · 时间线`, desc: '从开始到现在的成长轨迹', tags: ['历程'], angle: Math.PI },
    { title: `${planetData.name} · 目标`, desc: '未来的方向与计划', tags: ['愿景'], angle: Math.PI * 1.5 },
  ];

  cards.forEach((card, i) => {
    const cardGroup = new THREE.Group();
    const angle = card.angle;
    const radius = 5;
    cardGroup.position.set(
      radius * Math.cos(angle),
      (i % 2 === 0 ? 1 : -1) * 0.8,
      radius * Math.sin(angle)
    );

    // Card background
    const w = 2.8, h = 1.6;
    const cardGeo = new THREE.PlaneGeometry(w, h);
    const cardMat = new THREE.MeshPhysicalMaterial({
      color: 0x111122, metalness: 0.1, roughness: 0.4,
      transparent: true, opacity: 0.85, side: THREE.DoubleSide,
      clearcoat: 0.1
    });
    const cardMesh = new THREE.Mesh(cardGeo, cardMat);
    cardMesh.userData.isCard = true;
    cardMesh.userData.cardIndex = i;
    cardGroup.add(cardMesh);

    // Card border
    const borderMat = new THREE.MeshBasicMaterial({
      color: planetData.color, transparent: true, opacity: 0.3,
      side: THREE.DoubleSide
    });
    const borderMesh = new THREE.Mesh(cardGeo, borderMat);
    borderMesh.position.z = -0.01;
    borderMesh.scale.set(1.02, 1.02, 1);
    cardGroup.add(borderMesh);

    // Make cards face center
    cardGroup.lookAt(cx, cy, cz);
    cardGroup.position.y += Math.sin(i * 1.5) * 0.3;

    scene.add(cardGroup);
    solarSystemObjects.push(cardGroup);
  });
}

// ── Raycaster ────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let hoveredPlanet = null;

function getPlanetMeshes() {
  const meshes = [];
  planetGroups.forEach(({ group, data }) => {
    group.children.forEach(child => {
      if (child.isMesh && !child.material.isSpriteMaterial) {
        child.userData.planetId = data.id;
        child.userData.planetData = data;
        meshes.push(child);
      }
    });
  });
  return meshes;
}

function onPointerMove(event) {
  pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
}

function onClick(event) {
  if (isZooming) return;

  raycaster.setFromCamera(pointer, camera);
  const meshes = getPlanetMeshes();
  const intersects = raycaster.intersectObjects(meshes);
  
  if (intersects.length > 0 && !solarSystemActive) {
    const data = intersects[0].object.userData.planetData;
    if (data) {
      zoomToPlanet(data);
    }
  } else if (solarSystemActive) {
    // Check card clicks in solar system
    const allMeshes = [];
    solarSystemObjects.forEach(obj => {
      obj.children.forEach(child => {
        if (child.userData.isCard) allMeshes.push(child);
      });
    });
    const cardIntersects = raycaster.intersectObjects(allMeshes);
    if (cardIntersects.length > 0) {
      showCardPanel(zoomTarget.detail);
    }
  }
}

// ── Zoom Animation ──────────────────────────────────────
function zoomToPlanet(data) {
  isZooming = true;
  zoomTarget = data;
  controls.autoRotate = false;
  
  // Find the planet group
  const pg = planetGroups.find(p => p.data.id === data.id);
  if (!pg) return;

  createSolarSystemView(data);
  solarSystemActive = true;
  document.getElementById('back-btn').classList.add('visible');
  document.getElementById('ui').style.opacity = '0';

  // Animate camera to center
  const startPos = camera.position.clone();
  const endPos = new THREE.Vector3(0, 2, 10);
  const startTarget = controls.target.clone();
  const endTarget = new THREE.Vector3(0, 0, 0);
  let progress = 0;
  const duration = 120;

  function animateZoom() {
    progress++;
    const t = Math.min(progress / duration, 1);
    const ease = 1 - Math.pow(1 - t, 3);

    camera.position.lerpVectors(startPos, endPos, ease);
    controls.target.lerpVectors(startTarget, endTarget, ease);
    controls.update();

    if (t < 1) {
      requestAnimationFrame(animateZoom);
    } else {
      isZooming = false;
    }
  }
  animateZoom();
}

function zoomOut() {
  isZooming = true;
  
  solarSystemObjects.forEach(o => scene.remove(o));
  solarSystemObjects = [];
  solarSystemActive = false;
  zoomTarget = null;
  document.getElementById('back-btn').classList.remove('visible');
  document.getElementById('ui').style.opacity = '1';
  closeCardPanel();

  const startPos = camera.position.clone();
  const endPos = new THREE.Vector3(0, 12, 28);
  const startTarget = controls.target.clone();
  const endTarget = new THREE.Vector3(0, 0, 0);
  let progress = 0;
  const duration = 100;

  function animateBack() {
    progress++;
    const t = Math.min(progress / duration, 1);
    const ease = 1 - Math.pow(1 - t, 3);

    camera.position.lerpVectors(startPos, endPos, ease);
    controls.target.lerpVectors(startTarget, endTarget, ease);
    controls.update();

    if (t < 1) {
      requestAnimationFrame(animateBack);
    } else {
      isZooming = false;
      controls.autoRotate = false;
    }
  }
  animateBack();
}

// ── Card Panel ───────────────────────────────────────────
function showCardPanel(detail) {
  const panel = document.getElementById('card-panel');
  const content = document.getElementById('panel-content');
  content.innerHTML = `
    <h2>${detail.title}</h2>
    <div class="sub">${detail.subtitle}</div>
    <div class="desc">${detail.desc}</div>
    <div class="tags">${detail.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
    ${detail.link ? `<div style="margin-top:20px"><a href="${detail.link}" style="color:#5e9eff;font-size:13px;text-decoration:none">▸ 了解更多 →</a></div>` : ''}
  `;
  panel.classList.add('open');
}

function closeCardPanel() {
  document.getElementById('card-panel').classList.remove('open');
}

// ── Events ──────────────────────────────────────────────
window.addEventListener('pointermove', onPointerMove);
window.addEventListener('click', onClick);
document.getElementById('back-btn').addEventListener('click', zoomOut);
document.getElementById('panel-close').addEventListener('click', closeCardPanel);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ── Animation Loop ─────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);

  // Rotate planets
  planetGroups.forEach(({ group, data, angle, orbitRadius }) => {
    if (solarSystemActive) return;
    group.children.forEach(child => {
      if (child.isMesh || child.isSprite) {
        child.rotation.y += 0.005;
      }
    });
    // Orbit
    group.position.x = orbitRadius * Math.cos(angle + Date.now() * 0.001 * data.speed);
    group.position.z = orbitRadius * Math.sin(angle + Date.now() * 0.001 * data.speed);
  });

  // Rotate star
  centralStar.rotation.y += 0.002;
  centralStar.children.forEach((child, i) => {
    if (i > 0 && i <= 3) {
      child.rotation.x += 0.001 * i;
    }
  });

  // Pulse solar system glow
  if (solarSystemActive) {
    solarSystemObjects.forEach(obj => {
      if (obj.isMesh && obj.material.wireframe && obj.material.transparent) {
        obj.material.opacity = 0.06 + Math.sin(Date.now() * 0.002) * 0.03;
      }
    });
  }

  controls.update();
  renderer.render(scene, camera);
}

// ── Start ───────────────────────────────────────────────
setTimeout(() => {
  document.getElementById('loading').classList.add('hidden');
  animate();
}, 800);
