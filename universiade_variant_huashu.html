<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成都大运会视觉系统 · 杨昀桦</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f6f3ec;
    --panel: rgba(255, 255, 255, 0.9);
    --text: #171717;
    --text-soft: rgba(23, 23, 23, 0.66);
    --line: rgba(23, 23, 23, 0.1);
    --grid: rgba(124, 116, 103, 0.18);
    --accent: #c84c35;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, #f8f5ef 0%, #f4f0e8 100%);
    color: var(--text);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  .grid-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.5;
    z-index: 0;
  }

  .grid-overlay::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right, var(--grid) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
    background-size:
      calc((100vw - 4rem) / 12) 100%,
      100% 11.111vh;
    background-position: 2rem 0, 0 0;
    background-repeat: repeat-x, repeat-y;
  }

  .page {
    position: relative;
    z-index: 1;
    padding: 2rem;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    padding-bottom: 1rem;
    margin-bottom: 2rem;
    border-bottom: 1px solid var(--line);
  }

  .back-link,
  .home-link {
    color: var(--text);
    text-decoration: none;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  .project-header {
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    gap: 1.5rem;
    align-items: end;
    margin-bottom: 3rem;
  }

  .project-header h1 {
    grid-column: 1 / span 7;
    font-size: clamp(3rem, 7vw, 6rem);
    line-height: 0.92;
    letter-spacing: -0.05em;
  }

  .project-meta {
    grid-column: 9 / span 4;
    font-size: 0.95rem;
    color: var(--text-soft);
  }

  .project-meta p + p { margin-top: 0.7rem; }

  .hero-image {
    position: relative;
    margin-bottom: 3rem;
    border: 1px solid var(--line);
    background: var(--panel);
    overflow: hidden;
    min-height: 28rem;
  }

  .hero-image::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(7, 15, 30, 0.06) 0%, rgba(7, 15, 30, 0.16) 34%, rgba(7, 15, 30, 0.62) 100%),
      linear-gradient(120deg, rgba(11, 18, 32, 0.44) 0%, transparent 40%);
    z-index: 1;
    pointer-events: none;
  }

  .hero-image img,
  .gallery-item img {
    width: 100%;
    display: block;
  }

  .hero-image img {
    height: 28rem;
    object-fit: cover;
    object-position: center 72%;
    transform: scale(1.02);
  }

  .hero-caption {
    position: absolute;
    left: 2rem;
    right: 2rem;
    bottom: 1.8rem;
    z-index: 2;
    color: #fff;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 1rem;
  }

  .hero-caption .label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    opacity: 0.82;
    margin-bottom: 0.45rem;
  }

  .hero-caption .title {
    font-size: clamp(1.8rem, 4vw, 3.2rem);
    line-height: 0.96;
    letter-spacing: -0.04em;
    font-weight: 800;
    max-width: 8ch;
  }

  .hero-caption .meta {
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.78;
    white-space: nowrap;
  }

  .gallery {
    display: grid;
    gap: 1.5rem;
  }

  .gallery-item {
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.82);
    padding: 1rem;
  }

  .gallery-item figcaption {
    margin-top: 0.85rem;
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(23, 23, 23, 0.52);
  }

  @media (max-width: 860px) {
    .page { padding: 1rem; }
    .project-header h1,
    .project-meta { grid-column: span 12; }
    .hero-image {
      min-height: 20rem;
    }
    .hero-image img {
      height: 20rem;
    }
    .hero-caption {
      left: 1rem;
      right: 1rem;
      bottom: 1rem;
      flex-direction: column;
      align-items: flex-start;
    }
    .hero-caption .meta {
      white-space: normal;
    }
    .grid-overlay::before {
      background-size: calc((100vw - 2rem) / 6) 100%, 100% 12.5vh;
      background-position: 1rem 0, 0 0;
    }
  }
</style>
</head>
<body>
<div class="grid-overlay"></div>
<div class="page">
  <div class="topbar">
    <a class="back-link" href="./index.html#works">Back to Works</a>
    <a class="home-link" href="./index.html">杨昀桦 / YyUHua</a>
  </div>

  <section class="project-header">
    <h1>成都大运会<br>视觉系统</h1>
    <div class="project-meta">
      <p>2023 · Visual System / Signage / Spatial Graphics</p>
      <p>围绕成都 2021 FISU World University Games 的视觉延展与空间落地，覆盖媒体工作间、悬挂导视、图形语言与系列应用。</p>
    </div>
  </section>

  <figure class="hero-image">
    <img src="./assets/a0e8e89a4ce6f4c42b2ec6eb9e0829a8-3.jpg" alt="成都大运会场馆航拍封面">
    <div class="hero-caption">
      <div>
        <div class="label">Featured Project</div>
        <div class="title">成都大运会视觉系统</div>
      </div>
      <div class="meta">Chengdu 2021 FISU</div>
    </div>
  </figure>

  <section class="gallery">
    <figure class="gallery-item">
      <img src="./assets/A6-3.png" alt="成都大运会竖版视觉方案">
      <figcaption>Visual Banners</figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="./assets/E.1-3.png" alt="成都大运会主视觉延展">
      <figcaption>Main Visual Extension</figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="./assets/1-1.png" alt="成都大运会图形系统应用">
      <figcaption>Graphic System Application</figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="./assets/A5-2.png" alt="成都大运会导视系统">
      <figcaption>Wayfinding System</figcaption>
    </figure>
  </section>
</div>
</body>
</html>
